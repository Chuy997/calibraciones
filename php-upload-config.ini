; Configuración personalizada para calibraciones
; Este archivo debe ser copiado a /etc/php/8.3/apache2/conf.d/99-calibraciones.ini
; con permisos de root

upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 300

; Instrucciones para aplicar:
; sudo cp /var/www/html/calibraciones/php-upload-config.ini /etc/php/8.3/apache2/conf.d/99-calibraciones.ini
; sudo systemctl restart apache2
